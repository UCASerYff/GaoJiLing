name: macOS parity validation
on:
  push:
    branches: ['codex/macos-parity-verify-20261127-5d09964bd5']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run focused macOS checks
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          bash Scripts/verify-macos.sh
